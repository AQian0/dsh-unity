# dsh-unity bundle patch.
#
# One row: the Host plugin that manages this package's 34 Unity skills. The
# plugin registers a provider per agent through `agent.ctx`, so every session
# gets the skills its own Unity project supports; `skills/` is this package's
# content.
#
# The row needs no config. Defaults: providerName "unity"; rank 600, the
# bundled-root convention (a project or custom root in the same layer wins a
# duplicate name); project gating on, leaving three workspace skills visible
# outside a Unity project; requirement enforcement, runtime context, skill
# watching and the /unity-status command on. Override the row to change them:
#
#   - id: unity-skills
#     name: '@aqian0/dsh-unity'
#     config:
#       workspaceSkills: [unity-cli]
#       exclude: [unity-pipeline]
- insert:
    - id: unity-skills
      name: '@aqian0/dsh-unity'
      config: {}
