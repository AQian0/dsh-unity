name: release

# 推 v<version> tag 触发（也可用 workflow_dispatch 传已有 tag 重跑）：
# 校验 tag 与 package.json 版本一致、tag 提交在 main 上 → 门禁 `pnpm test`
# （vp check 的 Oxfmt + Oxlint → tsc 类型检查 → node --test）与
# `pnpm run validate`（34 个技能的内容合规）→ 显式 `pnpm run build` →
# 校验 `pnpm pack` 的内容清单 → 用 npm 可信发布（GitHub OIDC，无需 NPM_TOKEN）
# 发布 → 创建 GitHub Release（已存在则跳过）。
#
# pnpm 只负责本地工具链：vite-plus（vp）与 tsc 都在 devDependencies 里，
# pnpm-lock.yaml 入库保证可复现安装。发布本身仍走 npm 的 trusted publishing
# （OIDC），npm 只出现在发布链路（npm view / npm publish）。
#
# 首次发布与 trusted publisher 配置：
# - npm 的 trusted publishing 需要先在 npmjs.com 的包设置里为 @aqian0/dsh-unity
#   指定这个仓库与 workflow 文件；首次发布包还不存在，需要本机用 token 手动
#   `npm publish` 一次，之后本 workflow 才能走 OIDC。
# - `environment: npm-release` 只有在仓库 Settings → Environments 里配置了
#   required reviewers 后才提供人工审批保护；未配置时等价于普通 job。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        # 有意不写具体版本号：格式示例保持与版本无关，发版时无需修改此处。
        description: 'Existing release tag to publish (format: vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        # Action 固定到提交 SHA（与 dsh-jj 相同版本）；升级时同步注释。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (v6.1.0)
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        # 不传 version：由 action 安装 package.json 里 packageManager 固定的
        # 精确 pnpm 版本（pnpm@12.16.1）。
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4 (v4.4.0)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 (v6.5.0)
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        # 可复现安装：使用入库的 pnpm-lock.yaml（发布必须基于确定的依赖树）。
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package metadata
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}" \
            || { echo "::error::tag ${RELEASE_TAG} does not match package.json ${version}"; exit 1; }
          node -e "const p = require('./package.json'); \
            if (p.private === true) throw new Error('package.json is private'); \
            if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing'); \
            if (p.publishConfig?.access !== 'public') throw new Error('publishConfig.access must be public');"

      - name: Verify the tag commit is on main
        # tag 必须落在 main 的祖先链上：workflow_dispatch 允许用旧 tag 重跑，但从未
        # 合入 main 的提交通不过这一步（有意设计）。checkout 是 detached HEAD，
        # 所以显式抓取 origin/main 再比较。
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::${RELEASE_TAG} points at a commit that is not on main"
            exit 1
          fi
          echo "${RELEASE_TAG} is on main"

      - name: Run the documented test gate
        # 与 ci.yml 相同：`pnpm test` = vp check（Oxfmt + Oxlint，warning 视为
        # 失败）+ tsc -p tsconfig.test.json + node --test。
        run: pnpm test

      - name: Validate the bundled skills
        # 34 个技能的结构、frontmatter、需求字段、正文体积与资源引用。
        run: pnpm run validate

      - name: Build the published output
        # lib/ 不入库；prepack（clean + build）也会构建，但这里显式构建一次，
        # 让下面的 pack 校验与最终发布看到同一份确定的产物。
        run: pnpm run build

      - name: Validate the publishable tarball
        # 用 --ignore-scripts 防止再次触发 prepack；缺 lib/types、许可证文件或
        # 技能内容的包对该版本不可挽回，所以显式断言内容而不是只信 files 字段。
        run: |
          pnpm pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/pack.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, 'utf8'));
          // `pnpm pack --json` 输出单个对象；兼容数组形式。
          const manifest = Array.isArray(parsed) ? parsed[0] : parsed;
          const packaged = new Set(manifest.files.map((entry) => entry.path));
          const required = [
            'lib/index.js',
            'lib/types/index.d.ts',
            'lib/frontmatter.js',
            'lib/gating.js',
            'lib/harness.js',
            'lib/project.js',
            'lib/registry.js',
            'lib/requirements.js',
            'lib/skills.js',
            'lib/watch.js',
            'lib/config.js',
            'lib/status.js',
            'lib/types/frontmatter.d.ts',
            'lib/types/gating.d.ts',
            'lib/types/harness.d.ts',
            'lib/types/project.d.ts',
            'lib/types/registry.d.ts',
            'lib/types/requirements.d.ts',
            'lib/types/skills.d.ts',
            'lib/types/watch.d.ts',
            'lib/types/config.d.ts',
            'lib/types/status.d.ts',
            'cordis.patch.yml',
            'icon.svg',
            'locale/en.json',
            'locale/zh.json',
            'README.md',
            'README.en.md',
            'docs/detail.zh.md',
            'docs/detail.en.md',
            'docs/frontmatter.md',
            'docs/compatibility.md',
            'upstream.lock.json',
            'LICENSE.md',
            'LICENSE-UNITY-COMPANION.md',
            'NOTICE.md',
            'CHANGELOG.md',
            'docs/design.md',
          ];
          const missing = required.filter((path) => !packaged.has(path));
          if (missing.length > 0) {
            console.error(`::error::publishable tarball is missing: ${missing.join(', ')}`);
            process.exit(1);
          }
          const junk = [...packaged].filter((path) =>
            /^(src|test|scripts|reports|node_modules|\.github|\.jj)\//.test(path),
          );
          if (junk.length > 0) {
            console.error(`::error::publishable tarball contains non-published paths: ${junk.join(', ')}`);
            process.exit(1);
          }
          const skills = [...packaged].filter((path) => /^skills\/[^/]+\/SKILL\.md$/.test(path));
          if (skills.length !== 34) {
            console.error(`::error::expected 34 skills in the tarball, found ${skills.length}`);
            process.exit(1);
          }
          console.log(`tarball contains all ${required.length} required files and 34 skills (${manifest.files.length} entries)`);
          NODE

      - name: Publish to npm with OIDC
        # 已发布则跳过（warning），使重跑可恢复；prerelease 走 next dist-tag。
        # 发布本身走 npm 的 trusted publishing（OIDC），不传 NPM_TOKEN。
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "@aqian0/dsh-unity@${version}" version >/dev/null 2>&1; then
            echo "::warning::@aqian0/dsh-unity@${version} already published; skipping npm publish"
            exit 0
          fi
          if [[ "${version}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        # Release 已存在则跳过；prerelease tag 自动标记 --prerelease。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "${RELEASE_TAG}")
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${args[@]}"
