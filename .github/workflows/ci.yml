name: ci

# Push/PR 质量门禁，跑的就是 README「开发与验证」里的命令。
#
# 本仓库是 npm 项目（package-lock.json 入库），没有 lint/format 工具链：
# 门禁由类型检查、单元测试、技能校验与发布 tarball 冒烟检查组成。测试与
# 校验脚本直接运行 TypeScript（Node 内置类型剥离），所以矩阵覆盖 engines
# 下限 22.18 与推荐的 24 LTS，两个版本上结论应当一致。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.18.0'
          - '24'
    steps:
      - name: Check out the repository
        # Action 固定到提交 SHA（与 dsh-jj 相同版本）；升级时同步注释。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (v6.1.0)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 (v6.5.0)
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # 可复现安装：直接使用入库的 package-lock.json。
        run: npm ci

      - name: Type-check sources, tests and scripts
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      - name: Validate the bundled skills
        # 34 个技能的结构、frontmatter、需求字段、正文体积与资源引用。
        run: npm run validate

      - name: Build and smoke-check the publishable tarball
        # release.yml 会断言完整清单；这里只抓 `files` 配错与构建失败，
        # --ignore-scripts 防止 prepack 再构建一次（上面刚构建过）。
        run: |
          npm run build
          npm pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/pack.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, 'utf8'));
          // `npm pack --json` 输出数组；兼容对象形式。
          const manifest = Array.isArray(parsed) ? parsed[0] : parsed;
          const packaged = new Set(manifest.files.map((entry) => entry.path));
          const required = [
            'lib/index.js',
            'lib/types/index.d.ts',
            'cordis.patch.yml',
            'icon.svg',
            'locale/en.json',
            'locale/zh.json',
            'README.md',
            'LICENSE.md',
            'LICENSE-UNITY-COMPANION.md',
            'NOTICE.md',
          ];
          const missing = required.filter((path) => !packaged.has(path));
          const junk = [...packaged].filter((path) =>
            /^(src|test|scripts|reports|node_modules|\.github|\.jj)\//.test(path),
          );
          if (missing.length > 0) {
            console.error(`::error::publishable tarball is missing: ${missing.join(', ')}`);
            process.exit(1);
          }
          if (junk.length > 0) {
            console.error(`::error::publishable tarball contains non-published paths: ${junk.join(', ')}`);
            process.exit(1);
          }
          console.log(`tarball smoke check passed (${manifest.files.length} entries)`);
          NODE
